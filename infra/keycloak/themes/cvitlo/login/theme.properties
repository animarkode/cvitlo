# Cvitlo login theme. Extends keycloak.v2 so only what differs lives here.
parent=keycloak.v2
import=common/keycloak

# css/styles.css is v2's own; cvitlo.css is appended so it wins on equal specificity.
styles=css/styles.css css/cvitlo.css

# Off on purpose: v2's script follows prefers-color-scheme; Cvitlo ships its own dark-mode script.
darkMode=false

locales=en

# Where "Back to Cvitlo" goes when Keycloak has no client to take the address from (e.g. "You are
# logged out" after a sign-out that did not start in the app). The AppHost sets CVITLO_APP_URL on Keycloak;
# in production Keycloak shares the app's host, so "/" is right without it.
cvAppUrl=${env.CVITLO_APP_URL:/}
