<app-orderable-list
  [items]="store.educations()"
  [hideTitle]="true"
  title="Education"
  addLabel="Add education"
  [titleFn]="educationTitle"
  (add)="store.addEducation()"
  (delete)="store.deleteEducation($event)"
  (itemDrop)="store.reorderEducations($event)">
  <ng-template let-item>
    <form [formGroup]="getForm(item)" class="flex flex-col gap-3 py-2">
      <!-- focusin/focusout drive the EntryTitles focus latch. -->
      <div
        class="grid grid-cols-[repeat(auto-fit,minmax(11rem,1fr))] gap-3"
        (focusin)="onTitleFocusIn(item)"
        (focusout)="onTitleFocusOut(item, $event)">
        <cv-field label="School" placeholder="e.g. University of Oxford" formControlName="school" />
        <cv-field label="Degree" placeholder="e.g. BSc Computer Science" formControlName="degree" />
      </div>
      <!-- @container on this row, not an ancestor, so the range matches its own width.
           At [300px, 456px) the grid has exactly 2 columns and City would sit alone, so it
           spans both there only. -->
      <div class="grid grid-cols-[repeat(auto-fit,minmax(9rem,1fr))] gap-3 @container">
        <cv-date-picker
          label="Start date"
          precision="month"
          [locale]="store.localization()"
          formControlName="startDate" />
        <cv-date-picker
          label="End date"
          precision="month"
          [allowPresent]="true"
          [locale]="store.localization()"
          formControlName="endDate" />
        <cv-field
          label="City"
          placeholder="e.g. Oxford"
          class="@[300px]:@max-[455px]:col-span-2"
          formControlName="city" />
      </div>
      <div class="flex flex-col gap-1.5">
        <span class="text-sm font-medium text-muted-foreground">Description</span>
        <cv-rich-text formControlName="description" placeholder="Describe your studies…" />
      </div>
    </form>
  </ng-template>
</app-orderable-list>
