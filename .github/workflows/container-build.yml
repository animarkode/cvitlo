name: Container build

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: cvitlo-api
            context: .
            dockerfile: src/api/Cvitlo.Api/Dockerfile
          - image: cvitlo-migrations
            context: .
            dockerfile: src/api/Jobs/Cvitlo.Migrations/Dockerfile
          - image: cvitlo-web
            context: src/web/cvitlo-app
            dockerfile: src/web/cvitlo-app/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          # Only cvitlo-web is run afterwards, so only it is loaded into the
          # local image store.
          load: ${{ matrix.image == 'cvitlo-web' }}
          tags: cvitlo/${{ matrix.image }}:pr
          cache-from: type=gha,scope=${{ matrix.image }}

      - name: Smoke-test cvitlo-web
        if: matrix.image == 'cvitlo-web'
        run: src/web/cvitlo-app/scripts/smoke-test-image.sh cvitlo/cvitlo-web:pr
